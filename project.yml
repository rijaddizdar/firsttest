# XcodeGen spec for the SwiftUI mock-up.
#
# Generates MoneyPals.xcodeproj (name is a PLACEHOLDER only — the real app name
# is held pending a trademark search and appears nowhere in the UI).
#
# Regenerate with:  xcodegen generate
# The committed .xcodeproj can also just be opened directly in Xcode.
#
# Target: iOS 17+, SwiftUI, on-device only (no backend, no packages).

name: MoneyPals
options:
  bundleIdPrefix: com.example.moneypals   # placeholder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MoneyPals:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Swift, assets and Info.plist.
      - path: App
        excludes:
          - "Content/**"
          - "Resources/Sounds/**"
      # Lesson content stays a FOLDER REFERENCE, so the bundle keeps the
      # Content/ tree and a writer can add a lesson file without regenerating
      # the project (see App/Content/curriculum.json).
      - path: App/Content
        type: folder
      # Penny's three sounds keep their Sounds/ folder in the bundle, so they
      # are looked up by name + subdirectory rather than flattened.
      - path: App/Resources/Sounds
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MoneyPals            # placeholder name
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        # Your own bundle id and Apple team, so the app can run on a real iPhone
        # or iPad. Both are read from the environment if set, so nothing secret
        # and nothing machine-specific is committed:
        #
        # All three come from Signing.xcconfig, which is the one file to edit.
        # Its defaults are simulator-only, so a fresh clone needs no account.
        PRODUCT_BUNDLE_IDENTIFIER: $(MONEYPALS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(MONEYPALS_TEAM)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"             # iPhone + iPad
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is allowed when a team is set, and skipped when it isn't, so a
        # plain simulator build still needs no account.
        CODE_SIGNING_ALLOWED: $(MONEYPALS_SIGNING)

  # Unit tests for the parts that must not silently break: content loading and
  # validation, the lesson engine's rules, and what the store saves.
  MoneyPalsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MoneyPals
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

# XcodeGen spec for the SwiftUI mock-up.
#
# Generates MoneyPals.xcodeproj (name is a PLACEHOLDER only — the real app name
# is held pending a trademark search and appears nowhere in the UI).
#
# Regenerate with:  xcodegen generate
# The committed .xcodeproj can also just be opened directly in Xcode.
#
# Target: iOS 17+, SwiftUI, on-device only (no backend, no packages).

name: MoneyPals
options:
  bundleIdPrefix: com.example.moneypals   # placeholder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MoneyPals:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MoneyPals            # placeholder name
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moneypals
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"             # iPhone + iPad
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO                   # simulator build needs no signing
